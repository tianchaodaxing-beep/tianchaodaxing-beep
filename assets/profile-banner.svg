<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">PANDAO — practical open-source tools</title>
  <desc id="desc">Make the repetitive part automatic. Tools for overlooked workflows, with local files, working demos, and useful outputs.</desc>
  <defs>
